{% if include.front_only %}
<div class="slabby-card-container slabby-card-static slabby-card-carousel-size slabby-cat-{{ include.category_key }}" data-no-flip="true">
    <div class="slabby-card">
        <!-- Front Only -->
        <div class="slabby-card-face slabby-card-front">
            <span class="slabby-card-category">{{ include.category }}</span>
            <div class="slabby-card-img-wrap">
                <img src="{{ include.image }}" alt="{{ include.alt }}" loading="eager" draggable="false" class="slabby-card-img" />
            </div>
            <div class="slabby-card-term-row">
                <h4 class="slabby-card-title">{{ include.title }}</h4>
            </div>
        </div>
    </div>
</div>
{% else %}
<div class="slabby-blog-card-stage">
    <div class="slabby-card-container slabby-cat-{{ include.category_key }} slabby-has-hint-{{ include.show_hint }}" tabindex="0" role="button" aria-label="Flip card for {{ include.title }}">
        <div class="slabby-card">
            <!-- Front -->
            <div class="slabby-card-face slabby-card-front">
                <span class="slabby-card-category">{{ include.category }}</span>
                <div class="slabby-card-img-wrap">
                    <img src="{{ include.image }}" alt="{{ include.alt }}" loading="lazy" class="slabby-card-img" />
                </div>
                <div class="slabby-card-term-row">
                    <h4 class="slabby-card-title">{{ include.title }}</h4>
                </div>
                <div class="slabby-card-hint">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.79 9.24V5.5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v3.74c1.21-.81 2-2.18 2-3.74 0-2.49-2.01-4.5-4.5-4.5s-4.5 2.01-4.5 4.5c0 1.56.79 2.93 2 3.74zm5.5 2.47c-.28-.14-.58-.21-.89-.21h-.61V5.5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v10.74l-3.44-.72c-.37-.08-.76.04-1.03.31-.43.44-.43 1.14 0 1.58l4.01 4.01c.38.37.89.58 1.42.58h6.1c1 0 1.84-.73 1.98-1.72l.63-4.47c.12-.85-.32-1.69-1.09-2.07l-4.08-2.03z"/></svg>
                    <span>Toca para revelar</span>
                </div>
            </div>
            <!-- Back -->
            <div class="slabby-card-face slabby-card-back">
                <button type="button" class="slabby-speaker-btn" onclick="playPronunciation('{{ include.title }}', event)" aria-label="Listen to pronunciation of {{ include.title }}" title="Listen pronunciation">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4c0 .55.45 1 1 1h3l3.29 3.29c.63.63 1.71.18 1.71-.71V6.41c0-.89-1.08-1.34-1.71-.71L7 9H4c-.55 0-1 .45-1 1zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 4.45v.2c0 .38.25.71.6.85C17.18 6.53 19 9.06 19 12s-1.82 5.47-4.4 6.5c-.36.14-.6.47-.6.85v.2c0 .63.63 1.07 1.21.85C18.6 19.11 21 15.84 21 12s-2.4-7.11-5.79-8.4c-.58-.23-1.21.22-1.21.85z"/></svg>
                </button>
                <div class="slabby-back-body">
                    <span class="slabby-card-category">{{ include.category }}</span>
                    <h4 class="slabby-back-title">{{ include.title }}</h4>
                    <p class="slabby-card-definition">{{ include.definition }}</p>
                    <div class="slabby-example-box">
                        <i class="fa-solid fa-comment slabby-speech-icon"></i>
                        <p class="slabby-example-phrase">{{ include.example }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endif %}
